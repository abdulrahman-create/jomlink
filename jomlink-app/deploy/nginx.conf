# ─────────────────────────────────────────────────────────────
# JOMLINK — nginx reverse proxy (VPS)
#
# Terminates TLS and proxies requests to the Next.js standalone
# container. Follows Next.js self-hosting guidance: put a hardened
# reverse proxy in front of the Node server (rate/size limits,
# gzip, security headers — offload from Node).
#
# TLS: the certbot container provisions certificates and drops them
# at /etc/letsencrypt on the shared volume. This config is mounted
# at /etc/nginx/conf.d/default.conf by docker-compose.yml.
#
# Adjust server_name to your real domain. Do NOT expose port 3000
# to the public in the cloud firewall (only 80/443).
# ─────────────────────────────────────────────────────────────

# Body size limit for form posts / ToyyibPay callbacks.
client_max_body_size 10m;

server {
    listen 80;
    server_name jomlink.com;
    # Redirect all HTTP → HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name jomlink.com;

    # Managed by certbot (mounted from the certbot container).
    ssl_certificate     /etc/letsencrypt/live/jomlink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jomlink.com/privkey.pem;

    # TLS hardening.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip for text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Next.js image optimizer + static assets: long cache.
    location /_next/static/ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        # No body caching — stream to upstream.
        proxy_request_buffering off;
    }
}